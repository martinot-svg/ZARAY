name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      # Execute ALL existing checks, even if one module fails. Node reports the
      # complete list of failing assertions and still exits non-zero on failures.
      - name: Run complete ZARAY regression suite
        run: |
          node --test --test-concurrency=2 \
            tests/motion.test.mjs \
            tests/context.test.mjs \
            tests/navigation.test.mjs \
            tests/enterprise-icon-topbar.test.mjs \
            tests/compact-workspace-density.test.mjs \
            tests/no-informational-guides.test.mjs \
            tests/complete-module-ui-unification.test.mjs \
            tests/brand.test.mjs \
            tests/wifi-key-rotation.test.mjs \
            tests/network-connector-security.test.mjs \
            tests/public-home.test.mjs \
            tests/premium-experience.test.mjs \
            tests/total-redesign.test.mjs \
            tests/workspace-art-direction.test.mjs \
            tests/remove-module-numbering-dark-home.test.mjs \
            tests/ux-progressive-disclosure.test.mjs \
            tests/contrast-guardian-stability.test.mjs \
            tests/compact-forms.test.mjs \
            tests/galactic-system.test.mjs \
            tests/zaccueil-asteroids.test.mjs \
            tests/password-visibility.test.mjs \
            tests/daily-inspiration-curation.test.mjs \
            tests/network-preparation.test.mjs \
            tests/native-routeros-engine.test.mjs \
            tests/native-network-reliability.test.mjs \
            tests/mikrotik-administration.test.mjs \
            tests/winbox-console.test.mjs \
            tests/hotspot-captive-catalog.test.mjs \
            tests/logo-palette.test.mjs \
            tests/logo-optimizer.test.mjs \
            tests/site-creation-identity.test.mjs \
            tests/public-wifi-web-portal.test.mjs \
            tests/residential-white-label.test.mjs \
            tests/site-notifications.test.mjs \
            tests/site-custom-domains.test.mjs \
            tests/site-notification-delegation.test.mjs \
            tests/residential-email-notifications.test.mjs \
            tests/residential-site-account-names.test.mjs \
            tests/site-friendly-account-path.test.mjs \
            tests/residential-alarm-schedule.test.mjs \
            tests/residential-android-companion.test.mjs \
            tests/dashboard-visual-refinement.test.mjs \
            tests/site-portal-studio.test.mjs \
            tests/mikrotik-captive-installation.test.mjs \
            tests/wifi-offline-preparation.test.mjs \
            tests/captive-site-logo-input-colors.test.mjs \
            tests/site-dual-logo-library.test.mjs \
            tests/seamless-global-navigation.test.mjs \
            tests/site-performance-overview.test.mjs \
            tests/fiveonepay-hybrid.test.mjs
      - run: node --test tests/network-inventory-coverage.test.mjs tests/network-routeros-projections.test.mjs tests/network-targeted-disconnect.test.mjs
      - run: node --test tests/network-rollback-plan.test.mjs
      - run: node --test tests/network-session-mock.test.mjs
      - run: node --experimental-strip-types --test tests/network-command-lease.test.mjs
      - run: node --experimental-strip-types --test tests/network-router-heartbeat.test.mjs
      - run: node --experimental-strip-types --test tests/preview-supabase-isolation.test.mjs
      - run: node --test tests/network-bounded-response.test.mjs
      - run: node --test tests/network-inventory-live-refresh.test.mjs
      - run: node --test tests/network-diagnostics-ping.test.mjs
      - run: node --test tests/native-routeros-online-parity.test.mjs
      - run: node --experimental-strip-types --test tests/network-winbox-workbench.test.mjs
      - run: node --experimental-strip-types --test tests/network-winbox-inspector-properties.test.mjs
      - run: node --experimental-strip-types --test tests/network-winbox-extended-inventory.test.mjs
      - run: python3 -m py_compile tools/winbox-lab/chr-boot.py tools/winbox-lab/chr-console-test.py tools/winbox-lab/verify-native-routeros-lab.py tools/winbox-lab/chr-rest-test.py
      - run: node --check network-connector/agent.mjs
      - run: npm run typecheck
      - run: npm run build

  # Temporary proof gate for the RouterOS-native agent. Runs only for this PR;
  # the disposable CHR is entirely private to the GitHub-hosted runner.
  native-chr-proof:
    if: github.ref == 'refs/heads/feature/winbox-native-online-administration-20261110' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU TCG
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86
      - name: Download verified RouterOS CHR image
        run: |
          mkdir -p chr-evidence
          curl -fsSL --max-time 100 --retry 3 https://download.mikrotik.com/routeros/7.24.6/chr-7.24.6.img.zip -o chr-evidence/chr.zip
          echo "692672e6cac9cfaa4f37c6334d07760d49e074b50befc61f0904270553f17126  chr-evidence/chr.zip" | sha256sum -c -
          unzip -p chr-evidence/chr.zip > chr-evidence/chr.img
      - name: Execute shipping native RouterOS inventory and Ping through real CHR
        run: python3 tools/winbox-lab/chr-rest-test.py chr-evidence/chr.img chr-evidence
      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-native-routeros-validation
          path: |
            chr-evidence/*.json
            chr-evidence/*.log
          retention-days: 7
          if-no-files-found: warn
