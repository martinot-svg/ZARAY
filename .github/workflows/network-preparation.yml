name: ZARAY first-router preparation
on:
  pull_request:
    paths:
      - 'src/app/gestion-reseau/**'
      - 'network-connector/**'
      - 'tests/network-preparation.test.mjs'
      - '.github/workflows/network-preparation.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/gestion-reseau/**'
      - 'network-connector/**'
      - 'tests/network-preparation.test.mjs'
      - '.github/workflows/network-preparation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/network-preparation.test.mjs tests/network-connector-security.test.mjs tests/hotspot-captive-catalog.test.mjs tests/public-wifi-web-portal.test.mjs
      - run: npm run typecheck
      - run: npm run build
