name: ZARAY residential lifecycle
on:
  push:
    paths:
      - 'src/app/abonnements/**'
      - 'src/app/api/network/agent/route.ts'
      - 'tests/residential-network-ack.test.mjs'
      - 'src/app/api/residential-subscriptions/**'
      - 'supabase/migrations/*residential_subscription_lifecycle.sql'
      - 'supabase/migrations/*residential_network_acknowledgement.sql'
      - 'tests/residential-lifecycle.test.mjs'
      - '.github/workflows/residential-lifecycle.yml'
  pull_request:
    paths:
      - 'src/app/abonnements/**'
      - 'src/app/api/residential-subscriptions/**'
      - 'supabase/migrations/*residential_subscription_lifecycle.sql'
      - 'tests/residential-lifecycle.test.mjs'
      - '.github/workflows/residential-lifecycle.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/residential-lifecycle.test.mjs tests/residential-network-ack.test.mjs
      - run: npm run typecheck
