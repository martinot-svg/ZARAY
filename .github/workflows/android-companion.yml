name: Android companion debug build
on:
  pull_request:
    paths:
      - 'mobile/android-alarms/**'
      - 'src/app/api/residential/alarm-*/**'
      - 'src/lib/residential-alarm-device-access.ts'
      - 'src/components/residential-alarm-preferences.tsx'
      - 'supabase/migrations/*residential_alarm*'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile unsigned Android debug APK and run Android lint
        run: gradle -p mobile/android-alarms :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Check debug APK exists
        run: test -s mobile/android-alarms/app/build/outputs/apk/debug/app-debug.apk
      # Deliberately no release keystore and no public APK publication.
