name: MikroTik CHR isolated VM boot smoke
on:
  pull_request:
    paths:
      - ".github/workflows/mikrotik-chr-boot.yml"
      - "tools/winbox-lab/chr-boot.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chr-boot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source QEMU emulator
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils
      - name: Verify official RouterOS CHR free RAW image
        run: |
          mkdir -p chr-evidence
          curl --fail --location --silent --show-error --retry 3 --max-time 100 \
            "https://download.mikrotik.com/routeros/7.24.6/chr-7.24.6.img.zip" -o chr-evidence/chr-7.24.6.img.zip
          echo "692672e6cac9cfaa4f37c6334d07760d49e074b50befc61f0904270553f17126  chr-evidence/chr-7.24.6.img.zip" | sha256sum -c -
          unzip -p chr-evidence/chr-7.24.6.img.zip > chr-evidence/chr.img
          test -s chr-evidence/chr.img
      - name: Boot CHR in QEMU software emulation with private NAT only
        run: python3 tools/winbox-lab/chr-boot.py chr-evidence/chr.img chr-evidence
      - name: Retain CHR boot and connection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-chr-7246-offline-boot
          path: |
            chr-evidence/*.json
            chr-evidence/*.log
          if-no-files-found: warn
          retention-days: 7
