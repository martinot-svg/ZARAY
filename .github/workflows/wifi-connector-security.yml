name: ZARAY Wi-Fi keys and MikroTik security
on:
  pull_request:
    paths:
      - 'src/lib/network-voucher-secret.ts'
      - 'src/app/api/wifi-vouchers/**'
      - 'src/app/api/network/agent/route.ts'
      - 'network-connector/**'
      - 'tests/wifi-key-rotation.test.mjs'
      - 'tests/network-connector-security.test.mjs'
      - 'supabase/migrations/*wifi_voucher_key_versioning.sql'
      - '.github/workflows/wifi-connector-security.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/network-voucher-secret.ts'
      - 'src/app/api/wifi-vouchers/**'
      - 'src/app/api/network/agent/route.ts'
      - 'network-connector/**'
      - 'tests/wifi-key-rotation.test.mjs'
      - 'tests/network-connector-security.test.mjs'
      - 'supabase/migrations/*wifi_voucher_key_versioning.sql'
      - '.github/workflows/wifi-connector-security.yml'
permissions:
  contents: read
jobs:
  voucher-connector-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/wifi-key-rotation.test.mjs tests/network-connector-security.test.mjs tests/wifi-numeric-pin.test.mjs tests/wifi-preprinted.test.mjs tests/wifi-password-length.test.mjs
      - run: node --check network-connector/agent.mjs
      - run: npm run typecheck
      - run: npm run build
