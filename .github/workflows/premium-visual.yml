name: ZARAY premium visual smoke
on:
  pull_request:
  push:
    branches:
      - main
      - fix/visible-premium-workspaces-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ZARAY
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start application
        run: |
          npm run start -- -p 3000 > /tmp/zaray-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/zaray-preview.log
          exit 1
      - name: Verify desktop, tablet, mobile and themes
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/premium-visual-audit.mjs
      - name: Verify compact forms on desktop, tablet and mobile
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/compact-forms-visual.mjs
      - name: Simulate mobile keyboard and verify fluid login glide
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/mobile-login-keyboard-visual.mjs
      - name: Verify sourced French inspirations through live API
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node tests/daily-inspiration-api-visual.mjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaray-premium-visual
          path: artifacts/premium-visual/
          if-no-files-found: warn
          retention-days: 14
