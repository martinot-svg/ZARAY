<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" aria-hidden="true">
  <!-- Earth's actual cloud/ocean texture comes from the supplied satellite reference.
       The contour is built to match the exact lower-left silhouette in Z'Accueil. -->
  <defs>
    <clipPath id="earth-surface"><path d="M0 9 C200 -35 600 -25 1000 360 L1000 360 H0 Z"/></clipPath>
    <linearGradient id="planet-shade" x1="0" y1="0" x2=".08" y2="1">
      <stop offset="0" stop-color="#0b3a62" stop-opacity=".08"/>
      <stop offset=".42" stop-color="#032544" stop-opacity=".15"/>
      <stop offset="1" stop-color="#020a1b" stop-opacity=".31"/>
    </linearGradient>
    <filter id="blue-atmosphere" x="-8%" y="-33%" width="116%" height="166%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g clip-path="url(#earth-surface)">
    <rect width="1000" height="360" fill="#0d3147"/>
    <image href="data:image/webp;base64," x="0" y="-200" width="1000" height="560" preserveAspectRatio="none"/>
    <rect width="1000" height="360" fill="url(#planet-shade)"/>
  </g>
  <path d="M0 9 C200 -35 600 -25 1000 360" fill="none" stroke="#3caaff" stroke-width="24" stroke-opacity=".18" filter="url(#blue-atmosphere)"/>
  <path d="M0 9 C200 -35 600 -25 1000 360" fill="none" stroke="#47bbf3" stroke-width="8" stroke-opacity=".23" filter="url(#blue-atmosphere)"/>
  <path d="M0 9 C200 -35 600 -25 1000 360" fill="none" stroke="#55c7ef" stroke-width="2.9" stroke-opacity=".64"/>
  <path d="M0 9 C200 -35 600 -25 1000 360" fill="none" stroke="#e1ffff" stroke-width=".9" stroke-opacity=".47"/>
</svg>
