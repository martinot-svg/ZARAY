plugins {
 id 'com.android.application'
}
android {
 namespace 'mg.compteinternet.alarmes'
 compileSdk 35
 defaultConfig {
  applicationId 'mg.compteinternet.alarmes'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '0.2.0'
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 buildTypes {
  release {
   // Signing key intentionally absent from source control.
   minifyEnabled false
  }
 }
}
dependencies {
 // Java API; pinned stable release, no Kotlin rewrite or unnecessary Room database.
 implementation 'androidx.work:work-runtime:2.11.2'
}
