plugins {
 id 'com.android.application'
}
android {
 namespace 'mg.compteinternet.alarmes'
 compileSdk 35
 defaultConfig {
  applicationId 'mg.compteinternet.alarmes'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '0.2.0'
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 testOptions {
  unitTests.includeAndroidResources = true
 }
 buildTypes {
  release {
   // Signing key intentionally absent from source control.
   minifyEnabled false
  }
 }
}
dependencies {
 // Java API; pinned stable release, no Kotlin rewrite or unnecessary Room database.
 implementation 'androidx.work:work-runtime:2.11.2'
 // JVM-based Android scheduler regression tests; never bundled into the APK.
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.17'
}
